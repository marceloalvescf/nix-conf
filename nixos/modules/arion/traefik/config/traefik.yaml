global:
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /etc/traefik
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: alvesmarcelocf@proton.me
      storage: /certs/acme.json
      dnsChallenge:
        provider: cloudflare
        # Ask the zone's own nameservers. Public recursive resolvers (and the
        # LAN router) answer _acme-challenge from cache, which stalls the
        # propagation check until it times out.
        resolvers:
        - "james.ns.cloudflare.com:53"
        - "marjory.ns.cloudflare.com:53"
        propagation:
          delayBeforeChecks: 30s

log:
  filePath: "/var/log/traefik.log"
  level: INFO
  maxSize: 10
  maxBackups: 3
  maxAge: 7

accessLog:
  filePath: "/var/log/access.log"
  format: "json"
  bufferingSize: 100   # batch writes, lighter on flash storage
